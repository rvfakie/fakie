name: Deploy Nuxt 3 SSR on Release

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.11.0'

      - name: 📥 Install dependencies
        run: npm i

      - name: 🔨 Build Nuxt SSR app
        run: npm run build

      - name: 📡 Upload .output/ to VPS via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".output/"
          target: "${{ secrets.VPS_DEPLOY_PATH }}"

      - name: 🚀 SSH into VPS & Restart App with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Restart with PM2
            if pm2 ls | grep "fakie.ru"; then
              pm2 restart fakie.ru
            fi
